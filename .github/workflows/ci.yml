name: Verification

# Garde-fou rapide sur chaque poussee : si le source ne compile meme pas,
# inutile d'attendre six minutes de PyInstaller pour l'apprendre.

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compilation du source
        run: python -m compileall -q machi_tool.py jarvis.py outils

      # Un plantage au demarrage est le seul defaut qu'on ne peut pas
      # diagnostiquer : sans console, l'exception tue le processus sans
      # fenetre, sans icone et sans une ligne. Ces cas-la tiennent la regle —
      # rien de facultatif n'empeche l'application de s'ouvrir.
      - name: Le demarrage survit a ce qui echoue
        run: python outils/test_demarrage.py

      # numpy seul : les tests de la dictee lisent du vrai son, mais le modele
      # (456 Mo) n'est jamais telecharge ici — un faux tient sa place.
      - name: La dictee reste sur le poste
        run: |
          python -m pip install --quiet numpy
          python outils/test_dictee.py

      # Jarvis POUR DE VRAI : les trois petits modeles d'openWakeWord (3,6 Mo)
      # et des voix de synthese (espeak-ng) -- « Hey Jarvis » le reveille, une
      # conversation non, et « Jarvis » appris a la francaise le reveille sans
      # que « j'arrive » ou « Travis » le fassent.
      - name: Jarvis ecoute, n'entend que son nom, et parle
        run: |
          sudo apt-get install -y -qq espeak-ng >/dev/null
          python -m pip install --quiet numpy onnxruntime
          mkdir -p "$RUNNER_TEMP/oww"
          for f in melspectrogram.onnx embedding_model.onnx hey_jarvis_v0.1.onnx; do
            curl -sSfL -o "$RUNNER_TEMP/oww/$f" "https://github.com/dscripka/openWakeWord/releases/download/v0.5.1/$f"
          done
          # Sa voix : Piper (espeak-ng + une voix legere), chargee en memoire --
          # les memes phonemes que piper.exe, et « stop » qui coupe net.
          curl -sSfL "https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_linux_x86_64.tar.gz" | tar xz -C "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/voix"
          curl -sSfL "https://github.com/rhasspy/piper/releases/download/v0.0.2/voice-fr-gilles-low.tar.gz" | tar xz -C "$RUNNER_TEMP/voix"
          JARVIS_MODELES="$RUNNER_TEMP/oww" \
          JARVIS_PIPER_DOSSIER="$RUNNER_TEMP/piper" \
          JARVIS_PIPER_VOIX="$RUNNER_TEMP/voix/fr-gilles-low.onnx" \
            python outils/test_jarvis.py

      - name: Version lisible
        run: echo "version = $(python outils/version.py)"

      - name: Coherence du tag de publication
        if: startsWith(github.ref, 'refs/tags/v')
        run: python outils/version.py --verifier "${GITHUB_REF_NAME}"

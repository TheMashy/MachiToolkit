name: Publication

# Fabrique l'exe portable sous Windows et le joint a une publication
# GitHub. C'est cette publication que les exemplaires deja installes
# viennent lire pour se mettre a jour tout seuls.
#
# Chaque fusion sur main sort un exe telechargeable. Deux formes, selon
# ce que dit VERSION :
#
#   VERSION porte un numero jamais publie  -> publication STABLE.
#   VERSION n'a pas bouge                  -> PRE-VERSION 1.x.y-dev.N,
#                                             N etant le numero du passage.
#
# Il n'y a donc rien a faire pour diffuser un changement : fusionner
# suffit. Qui coche « Accepter les pre-versions » dans l'application
# recoit chaque fusion ; qui ne la coche pas reste sur les stables.
#
# Le numero est grave dans le source avant la compilation : un exe de
# developpement qui se croirait a la version stable dont il est issu se
# proposerait sa propre mise a jour en boucle.
#
# Poser un tag, ou lancer le workflow a la main, remplace les fichiers
# d'une publication deja sortie — pour rattraper un binaire rate sans
# changer de numero.

on:
  push:
    branches: [main]     # build de controle, artefact seulement
    tags: ['v*']         # build + publication
  workflow_dispatch:
    inputs:
      publier:
        description: "Creer la publication GitHub (sinon, exe en artefact seulement)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Dependances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.11.1

      - name: Coherence du tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: python outils/version.py --verifier "${GITHUB_REF_NAME}"

      - name: Choix du numero
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REFERENCE: ${{ github.ref }}
        run: |
          set -euo pipefail
          base="$(python outils/version.py)"

          # Sur un tag, la version est celle du tag, point.
          sur_tag=non
          case "$REFERENCE" in refs/tags/*) sur_tag=oui ;; esac

          if [ "$sur_tag" = "oui" ] || ! gh release view "v$base" >/dev/null 2>&1; then
            numero="$base"
            prerelease=false
          else
            # La stable existe deja : ce passage sort une pre-version.
            numero="$(python outils/version.py --dev "${{ github.run_number }}")"
            prerelease=true
          fi

          # Grave dans le source avant compilation.
          python outils/version.py --poser "$numero"
          echo "numero=$numero"         >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Cette compilation sortira en $numero (pre-version : $prerelease)"

      - name: Icone
        run: python machi_tool.py --icone

      - name: Compilation
        run: pyinstaller --noconfirm --clean MachiTool.spec

      - name: Empreinte SHA-256
        shell: pwsh
        run: |
          $empreinte = (Get-FileHash dist/MachiTool.exe -Algorithm SHA256).Hash.ToLower()
          "$empreinte  MachiTool.exe" |
            Out-File -Encoding ascii dist/MachiTool.exe.sha256
          Write-Host "SHA-256 : $empreinte"

      - name: Verification du binaire
        shell: pwsh
        run: |
          $exe = Get-Item dist/MachiTool.exe
          Write-Host ("taille : {0:N1} Mo" -f ($exe.Length / 1MB))
          if ($exe.Length -lt 8MB) { throw "exe suspect : trop petit" }

      - uses: actions/upload-artifact@v4
        with:
          name: MachiTool-${{ steps.version.outputs.numero }}
          path: |
            dist/MachiTool.exe
            dist/MachiTool.exe.sha256
          retention-days: 30

      - name: Publication GitHub
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REFERENCE: ${{ github.ref }}
          FORCEE: ${{ inputs.publier }}
        run: |
          set -euo pipefail
          numero="${{ steps.version.outputs.numero }}"
          tag="v$numero"
          fichiers="dist/MachiTool.exe dist/MachiTool.exe.sha256"

          if gh release view "$tag" > /dev/null 2>&1; then
            deja=oui
          else
            deja=non
          fi

          # Un tag pousse ou un lancement a la main disent explicitement
          # « sors cette version », meme si elle est deja sortie.
          explicite=non
          case "$REFERENCE" in refs/tags/*) explicite=oui ;; esac
          [ "$FORCEE" = "true" ] && explicite=oui

          if [ "$deja" = "non" ]; then
            if [ "${{ steps.version.outputs.prerelease }}" = "true" ]; then
              gh release create "$tag" $fichiers \
                --title "Machi Tool $numero" --prerelease \
                --notes "Pre-version issue de la fusion sur main. Elle n'est proposee qu'aux installations ayant coche « Accepter les pre-versions »."
            else
              gh release create "$tag" $fichiers \
                --title "Machi Tool $numero" --generate-notes
            fi
            echo "Nouvelle publication : $(gh release view "$tag" --json url --jq .url)"
          elif [ "$explicite" = "oui" ]; then
            gh release upload "$tag" $fichiers --clobber
            echo "Fichiers remplaces : $(gh release view "$tag" --json url --jq .url)"
          else
            echo "$tag existe deja, rien a faire."
          fi

          # Les pre-versions s'accumuleraient a chaque fusion : on ne garde
          # que les cinq dernieres, les stables n'etant jamais touchees.
          gh release list --limit 100 --json tagName,isPrerelease \
            --jq '.[] | select(.isPrerelease) | .tagName' \
            | grep -- '-dev\.' | tail -n +6 \
            | while read -r vieille; do
                echo "Menage : suppression de $vieille"
                gh release delete "$vieille" --yes --cleanup-tag || true
              done
